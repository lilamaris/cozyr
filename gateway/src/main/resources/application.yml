server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URI:http://identity-service:8081}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/user/**, /.well-known/jwks.json

            - id: board-service
              uri: ${BOARD_SERVICE_URI:http://board-service:8082}
              predicates:
                - Path=/api/v1/boards/**