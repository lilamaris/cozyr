server:
  port: 8080

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: board-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/boards/**

            - id: identity-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/auth/**, /api/v1/user/**, /.well-known/jwks.json