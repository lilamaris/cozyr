server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: board-service
              uri: ${BOARD_SERVICE_URI:http://board-service:8082}
              predicates:
                - Path=/api/v1/boards/**

            - id: statistics-service
              uri: ${STATISTICS_SERVICE_URI:http://statistics-service:8083}
              predicates:
                - Path=/api/v1/statistics/**

            - id: reservation-service
              uri: ${RESERVATION_SERVICE_URI:http://reservation-service:8084}
              predicates:
                - Path=/api/v1/rooms/**, /api/v1/reservation/**