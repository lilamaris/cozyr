cozyr:
  identity-service:
    web:
      baseUrl: ${BASE_URL:http://cozyr}
    jwks:
      io:
        activeSignableKid: "key-20260715-005317"
        keys:
          - "key-20260715-005313"
          - "key-20260715-005317"

server:
  port: 8082

logging:
  file:
    name: ${LOG_DIR:./log}/${spring.application.name}.log

spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:h2:mem:${spring.application.name};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

  kafka:
    bootstrap-servers: ${KAFKA_URL:kafka:9092}
    client-id: ${spring.application.name}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probe:
        enabled: true
      roles: ADMIN
      show-details: when-authorized
      show-components: when-authorized
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 0.1
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:}