x-app-healthcheck: &app-healthcheck
  test: [CMD-SHELL, 'curl -fsS "http://127.0.0.1:$${PORT}/actuator/health/readiness" >/dev/null']
  interval: 5s
  start_period: 30s
  retries: 20

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cozyr
      POSTGRES_PASSWORD: cozyr-demo
      POSTGRES_DB: cozyr
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-demo-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cozyr -d cozyr']
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null']
      interval: 10s
      start_period: 20s
      retries: 15

  client:
    image: ${COZYR_REGISTRY_HOST}/${COZYR_IMAGE_NAMESPACE:-cozyr}/client:${COZYR_CLIENT_IMAGE_TAG:-local}
    environment:
      HOST: 0.0.0.0
      PORT: "5175"
    ports:
      - "127.0.0.1:5175:5175"

  gateway:
    image: ${COZYR_REGISTRY_HOST}/${COZYR_IMAGE_NAMESPACE:-cozyr}/gateway:${COZYR_IMAGE_TAG:-local}
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      PORT: 8080
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: false
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: false
      BOARD_SERVICE_URI: http://board-service:8082
      RESERVATION_SERVICE_URI: http://reservation-service:8084
      STATISTICS_SERVICE_URI: http://statistics-service:8083
    healthcheck: *app-healthcheck

  board-service:
    image: ${COZYR_REGISTRY_HOST}/${COZYR_IMAGE_NAMESPACE:-cozyr}/board-service/launcher:${COZYR_IMAGE_TAG:-local}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment: &app-environment
      PORT: 8082
      APPLICATION_NAME: board-service
      DB_URL: jdbc:postgresql://postgres:5432/board
      DB_USERNAME: cozyr
      DB_PASSWORD: cozyr-demo
      KAFKA_URL: kafka:9092
      JWKS_URL: http://gateway:8080/.well-known/jwks.json
      COZYR_BASE_URL: http://localhost:8080
      DDL_AUTO: validate
      LOG_DIR: /tmp/cozyr
    healthcheck: *app-healthcheck

  reservation-service:
    image: ${COZYR_REGISTRY_HOST}/${COZYR_IMAGE_NAMESPACE:-cozyr}/reservation-service/launcher:${COZYR_IMAGE_TAG:-local}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      <<: *app-environment
      PORT: 8084
      APPLICATION_NAME: reservation-service
      DB_URL: jdbc:postgresql://postgres:5432/reservation
    healthcheck: *app-healthcheck

  statistics-service:
    image: ${COZYR_REGISTRY_HOST}/${COZYR_IMAGE_NAMESPACE:-cozyr}/statistics-service/launcher:${COZYR_IMAGE_TAG:-local}
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      <<: *app-environment
      PORT: 8083
      APPLICATION_NAME: statistics-service
      DB_URL: jdbc:postgresql://postgres:5432/statistics
    healthcheck: *app-healthcheck

volumes:
  postgres-data:
