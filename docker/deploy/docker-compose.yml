x-app-healthcheck-defaults: &app-healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 45s
  test:
    - CMD-SHELL
    - 'curl -fsS "http://127.0.0.1:$${PORT}/actuator/health/readiness" >/dev/null'

services:
  gateway:
    image: "${REGISTRY_HOST}/${NAMESPACE}/gateway:${IMAGE_TAG}"
    restart: unless-stopped
    container_name: cozyr-gateway
    cpus: 2.0
    mem_limit: 512m
    ports:
      - "${GATEWAY_BIND_HOST:-0.0.0.0}:${GATEWAY_BIND_PORT:-80}:${GATEWAY_SERVICE_PORT:?GATEWAY_SERVICE_PORT must be provided}"
    env_file:
      - .env.app
    environment:
      PORT: "${GATEWAY_SERVICE_PORT:?GATEWAY_SERVICE_PORT must be provided}"
      BOARD_SERVICE_URI: "http://${BOARD_SERVICE_NAME:-board-service}:${BOARD_SERVICE_PORT:-8082}"
      STATISTICS_SERVICE_URI: "http://${STATISTICS_SERVICE_NAME:-statistics-service}:${STATISTICS_SERVICE_PORT:-8083}"
      RESERVATION_SERVICE_URI: "http://${RESERVATION_SERVICE_NAME:-reservation-service}:${RESERVATION_SERVICE_PORT:-8084}"
    healthcheck:
      <<: *app-healthcheck-defaults

  board-service:
    image: "${REGISTRY_HOST}/${NAMESPACE}/board-service:${IMAGE_TAG}"
    restart: unless-stopped
    container_name: cozyr-board
    cpus: 1.0
    mem_limit: 1g
    expose:
      - "${BOARD_SERVICE_PORT:?BOARD_SERVICE_PORT must be provided}"
    env_file:
      - .env.app
    environment:
      SPRING_APPLICATION_NAME: "${BOARD_SERVICE_NAME:-board-service}"
      PORT: "${BOARD_SERVICE_PORT:?BOARD_SERVICE_PORT must be provided}"
      DB_URL: "${DB_BASE_URL:?DB_BASE_URL must be provided}?currentSchema=${BOARD_SERVICE_DB_SCHEMA:?BOARD_SERVICE_DB_SCHEMA must be provided}"
      DB_USERNAME: "${BOARD_SERVICE_DB_USERNAME:?BOARD_SERVICE_DB_USERNAME must be provided}"
      DB_PASSWORD: "${BOARD_SERVICE_DB_PASSWORD:?BOARD_SERVICE_DB_PASSWORD must be provided}"
    healthcheck:
      <<: *app-healthcheck-defaults

  statistics-service:
    image: "${REGISTRY_HOST}/${NAMESPACE}/statistics-service:${IMAGE_TAG}"
    restart: unless-stopped
    container_name: cozyr-statistics
    cpus: 1.0
    mem_limit: 1g
    expose:
      - "${STATISTICS_SERVICE_PORT:?STATISTICS_SERVICE_PORT must be provided}"
    env_file:
      - .env.app
    environment:
      SPRING_APPLICATION_NAME: "${STATISTICS_SERVICE_NAME:-statistics-service}"
      PORT: "${STATISTICS_SERVICE_PORT:?STATISTICS_SERVICE_PORT must be provided}"
      DB_URL: "${DB_BASE_URL:?DB_BASE_URL must be provided}?currentSchema=${STATISTICS_SERVICE_DB_SCHEMA:?STATISTICS_SERVICE_DB_SCHEMA must be provided}"
      DB_USERNAME: "${STATISTICS_SERVICE_DB_USERNAME:?STATISTICS_SERVICE_DB_USERNAME must be provided}"
      DB_PASSWORD: "${STATISTICS_SERVICE_DB_PASSWORD:?STATISTICS_SERVICE_DB_PASSWORD must be provided}"
    healthcheck:
      <<: *app-healthcheck-defaults

  reservation-service:
    image: "${REGISTRY_HOST}/${NAMESPACE}/reservation-service:${IMAGE_TAG}"
    restart: unless-stopped
    container_name: cozyr-reservation
    cpus: 1.0
    mem_limit: 1g
    expose:
      - "${RESERVATION_SERVICE_PORT:?RESERVATION_SERVICE_PORT must be provided}"
    env_file:
      - .env.app
    environment:
      SPRING_APPLICATION_NAME: "${RESERVATION_SERVICE_NAME:-reservation-service}"
      PORT: "${RESERVATION_SERVICE_PORT:?RESERVATION_SERVICE_PORT must be provided}"
      DB_URL: "${DB_BASE_URL:?DB_BASE_URL must be provided}?currentSchema=${RESERVATION_SERVICE_DB_SCHEMA:?RESERVATION_SERVICE_DB_SCHEMA must be provided}"
      DB_USERNAME: "${RESERVATION_SERVICE_DB_USERNAME:?RESERVATION_SERVICE_DB_USERNAME must be provided}"
      DB_PASSWORD: "${RESERVATION_SERVICE_DB_PASSWORD:?RESERVATION_SERVICE_DB_PASSWORD must be provided}"
    healthcheck:
      <<: *app-healthcheck-defaults
