x-app-healthcheck-defaults: &infra-healthcheck-defaults
  interval: 15s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:18-alpine}"
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cozyr}"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be provided}"

      IDENTITY_DB_PASSWORD: "${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be provided}"
      BOARD_DB_PASSWORD: "${BOARD_DB_PASSWORD:?BOARD_DB_PASSWORD must be provided}"
      STATISTICS_DB_PASSWORD: "${STATISTICS_DB_PASSWORD:?STATISTICS_DB_PASSWORD must be provided}"
    ports:
      - "${BIND_HOST}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./conf/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *infra-healthcheck-defaults
      test:
        - "CMD-SHELL"
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"

  postgres-exporter:
    image: "${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:latest}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-shrturl}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_EXPORTER_USERNAME:-postgres_exporter}"
      DATA_SOURCE_PASS: "${POSTGRES_EXPORTER_PASSWORD:-postgres_exporter}"
    ports:
      - "${BIND_HOST:-0.0.0.0}:9187:9187"

  kafka:
    image: "${KAFKA_IMAGE:-confluentinc/cp-kafka:latest}"
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    environment:
      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT://:29092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"

      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_PROTOCOL_VERSION: "3.8"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_JMX_PORT: "9101"
      KAFKA_JMX_HOSTNAME: "kafka"
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka-broker"
    ports:
      - "${BIND_HOST}:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *infra-healthcheck-defaults
      test:
        - "CMD-SHELL"
        - "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"

  kafka-exporter:
    image: "${KAFKA_EXPORTER_IMAGE:-danielqsj/kafka-exporter:v1.8.0}"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.2
    mem_limit: 1g
    command: [ "--kafka.server=${KAFKA_EXPORTER_BOOTSTRAP_SERVERS:-kafka:29092}" ]
    ports:
      - "${BIND_HOST:-0.0.0.0}:9308:9308"

  kafka-jmx-exporter:
    image: "${KAFKA_JMX_EXPORTER_IMAGE:-bitnami/jmx-exporter:latest}"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.2
    mem_limit: 1g
    environment:
      - JVM_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
    command: [ "9404", "/opt/bitnami/jmx-exporter/config/kafka.yml" ]
    volumes:
      - ./conf/kafka-jmx-exporter/kafka.yml:/opt/bitnami/jmx-exporter/config/kafka.yml:ro
    ports:
      - "${BIND_HOST:-0.0.0.0}:9404:9404"

volumes:
  postgres-data:
  kafka-data: