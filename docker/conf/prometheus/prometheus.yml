global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kafka-metrics
    static_configs:
      - targets:
          - kafka-exporter:9308
        labels:
          service: kafka
          exporter: kafka_exporter
      - targets:
          - kafka-jmx-exporter:9404
        labels:
          service: kafka
          exporter: kafka_jmx_exporter