cozyr:
  board-service:
    web:
      baseUrl: ${BASE_URL:http://cozyr}
  identity-service:
    resource-server:
      jwksUri: ${JWKS_URL:http://localhost:8080/.well-known/jwks.json}

server:
  port: ${PORT:8081}

logging:
  file:
    name: ${LOG_DIR:./log}/${spring.application.name}.log

spring:
  application:
    name: board-service

  datasource:
    url: ${DB_URL:jdbc:h2:mem:${spring.application.name};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

  kafka:
    bootstrap-servers: ${KAFKA_URL:kafka:9092}
    consumer:
      group-id: ${spring.application.name}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            key:
              delegate:
                class: org.apache.kafka.common.serialization.StringDeserializer
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
          json:
            trusted.packages: "*"
            use.type.headers: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probe:
        enabled: true
      roles: ADMIN
      show-details: when-authorized
      show-components: when-authorized
      group:
        liveness:
          include: "livenessState"
        readiness:
          include: "readinessState,db"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 0.1
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:}